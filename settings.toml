IMAGES_FINAL_FOLDER='chosen_images'
AUDIOS_TEMP_FOLDER='temp_audios'
ENHANCED_TEXT_FILENAME='script_enhanced.json'
SPLIT_TEXTS_FILENAME='split_texts.json'
AUDIO_CUT_FILENAME='audio_cut.json'
